# =============================================================================
#  slam_toolbox - ONLINE ASYNC MAPPING
#
#  Tuned for a small (170 mm) robot with an RPLidar A1M8 on a Pi 4. The main
#  departures from the stock config:
#
#    * minimum_travel_distance / _heading are small, because this robot's
#      whole world is at close range - waiting 0.5 m between scans loses
#      detail in a room-sized map.
#    * correlation search space is small: the odometry is decent (EKF-fused)
#      so we do not need to search far, and a big search window is what makes
#      slam_toolbox eat a Pi 4 alive.
#    * resolution 0.03 rather than 0.05, since a 17 cm robot needs to see
#      gaps that a 5 cm grid would smear shut.
# =============================================================================

slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # --- plugins -------------------------------------------------------------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # --- frames and topics ---------------------------------------------------
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # --- map ------------------------------------------------------------------
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02      # 50 Hz map -> odom
    map_update_interval: 1.0
    resolution: 0.03
    max_laser_range: 8.0                # A1M8 is spec'd to 12 m, trust 8 indoors
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # --- scan matching --------------------------------------------------------
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10       # metres between keyframes
    minimum_travel_heading: 0.10        # radians
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.12
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # --- correlation (matching a new scan against the running map) -----------
    correlation_search_space_dimension: 0.4
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    # --- correlation (loop closure search) ------------------------------------
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # --- scan matcher penalties ------------------------------------------------
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
