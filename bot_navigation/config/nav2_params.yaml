# =============================================================================
#  Nav2 parameters  --  ROS 2 Humble
#
#  Tuned for a 170 mm circular differential-drive robot with an RPLidar A1M8.
#
#  Things that are deliberately different from the Nav2 defaults, and why:
#
#  * robot_radius 0.11 rather than the default 0.22. The default assumes a
#    TurtleBot-sized machine; leaving it would make this robot refuse to plan
#    through any normal doorway gap it can actually fit through.
#  * costmap resolution 0.03 to match the SLAM map. A 5 cm grid on a 17 cm
#    robot quantises the world into blocks a third of its own width.
#  * inflation_radius 0.22 with cost_scaling_factor 3.5: enough standoff to
#    keep the robot off walls, not so much that a 60 cm corridor becomes a
#    solid block of lethal cost.
#  * RegulatedPurePursuit rather than DWB. On a small differential base with
#    modest odometry, RPP is much better behaved and far cheaper on a Pi 4.
#  * All frames use base_footprint, matching the EKF's output transform.
# =============================================================================

# =============================================================================
#  AMCL  (only used if you run bot_navigation/launch/amcl.launch.py)
# =============================================================================
amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan

    # Motion model noise. These are for a diff-drive base with reasonable
    # wheel odometry; raise alpha1/alpha2 if the robot's heading estimate
    # snaps around when it turns.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.20      # rotation noise from rotation
    alpha2: 0.20      # rotation noise from translation
    alpha3: 0.20      # translation noise from translation
    alpha4: 0.20      # translation noise from rotation
    alpha5: 0.20

    # Sensor model
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: 0.15
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    # Particle filter
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1

    # Update thresholds. Small, because this robot moves in small increments.
    update_min_a: 0.15
    update_min_d: 0.10

    save_pose_rate: 0.5
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: false

# =============================================================================
#  Behaviour tree navigator
# =============================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 0.3

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# =============================================================================
#  Controller  (path following)
# =============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0     # 20 Hz is a struggle for a Pi 4 with SLAM up

    # Below these, a reported velocity is treated as zero.
    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.005

    failure_tolerance: 0.5
    odom_topic: /odometry/filtered

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Small robot, slow robot: 0.5 m in 10 s (the default) would let it sit
      # and grind for ages before anyone notices it is stuck.
      required_movement_radius: 0.10
      movement_time_allowance: 12.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.18
      lookahead_dist: 0.25
      min_lookahead_dist: 0.12
      max_lookahead_dist: 0.45
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true

      # Slow down for tight curves and near obstacles rather than trying to
      # take them at full speed and overshooting.
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30
      regulated_linear_scaling_min_speed: 0.08
      cost_scaling_dist: 0.30
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.5

      # Differential drive: turn in place when badly misaligned instead of
      # driving a long arc to correct heading.
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      rotate_to_heading_angular_vel: 1.2
      max_angular_accel: 3.0

      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.5
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25

# =============================================================================
#  Local costmap  (rolling window around the robot, obstacle avoidance)
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.03
      robot_radius: 0.11
      transform_tolerance: 0.3

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        scan:
          topic: /scan
          sensor_frame: laser_frame
          data_type: "LaserScan"
          max_obstacle_height: 0.30
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.15    # A1M8 returns junk closer than ~15 cm
          raytrace_max_range: 7.0
          raytrace_min_range: 0.15
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.5
        inflation_radius: 0.22

      always_send_full_costmap: true

# =============================================================================
#  Global costmap  (the whole map, path planning)
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.03
      robot_radius: 0.11
      track_unknown_space: true
      transform_tolerance: 0.3

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        scan:
          topic: /scan
          sensor_frame: laser_frame
          data_type: "LaserScan"
          max_obstacle_height: 0.30
          min_obstacle_height: 0.0
          clearing: true
          marking: true
          obstacle_max_range: 6.0
          obstacle_min_range: 0.15
          raytrace_max_range: 7.0
          raytrace_min_range: 0.15
          inf_is_valid: false

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.5
        inflation_radius: 0.22

      always_send_full_costmap: true

# =============================================================================
#  Map server / saver
# =============================================================================
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""        # supplied on the command line by amcl.launch.py

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# =============================================================================
#  Planner
# =============================================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.15
      use_astar: true          # cheaper than Dijkstra on a Pi for small maps
      allow_unknown: true

# =============================================================================
#  Path smoother
# =============================================================================
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# =============================================================================
#  Recovery behaviours
# =============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0

# =============================================================================
#  Waypoint follower
# =============================================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# =============================================================================
#  Velocity smoother
#  Publishes /cmd_vel_smoothed, which twist_mux forwards to the controller.
# =============================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 2.0]
    min_velocity: [-0.22, 0.0, -2.0]
    max_accel: [0.6, 0.0, 3.0]
    max_decel: [-0.6, 0.0, -3.0]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# =============================================================================
#  robot_state_publisher entry - Nav2's bringup passes params to it too
# =============================================================================
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
