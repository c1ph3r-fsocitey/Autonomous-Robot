; =============================================================================
;  PlatformIO project for the robot's ESP32 micro-ROS firmware.
;
;  Build + flash (from this directory, with the ESP32 plugged into the Pi):
;      pio run -t upload
;      pio device monitor            # optional, will show boot messages
;
;  IMPORTANT: micro_ros_platformio builds the whole micro-ROS static library
;  the first time. On a Pi 4 that takes ~10-20 minutes. It is cached afterwards.
;  If the build fails on a fresh checkout, run:  pio run -t clean_microros
; =============================================================================

[env:esp32dev]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino

; --- micro-ROS ---------------------------------------------------------------
board_microros_distro    = humble
board_microros_transport = serial

; --- serial ------------------------------------------------------------------
monitor_speed = 115200
upload_speed  = 921600

; --- libraries ---------------------------------------------------------------
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    madhephaestus/ESP32Encoder@^0.11.7
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    Wire

build_flags =
    -Wno-unused-parameter

; If your board is a DevKitC with the CP2102 bridge and uploads fail at
; 921600, drop upload_speed to 460800 or 115200.
